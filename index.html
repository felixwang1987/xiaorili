      }

      function dedupeHolidays(items) {
        const unique = new Map();
        items.filter(Boolean).forEach((item) => {
          const normalized = normalizeHoliday(item.region, item);
          if (normalized) unique.set(`${normalized.date}|${normalized.name}|${normalized.region}|${normalized.type}`, normalized);
        });
        return [...unique.values()].sort((a, b) => a.date.localeCompare(b.date) || a.region.localeCompare(b.region) || a.name.localeCompare(b.name));
      }

      // 居林工厂补假规则验算（输入 -> 输出）：
      // 1. 输入：2026-01-03（周六）节假日 -> 输出：2026-01-05（下周一）补假。
      // 2. 输入：2026-01-04（周日）节假日 -> 输出：2026-01-05（下周一）补假。
      // 3. 输入：2026-01-03（周六）、2026-01-04（周日）连续节假日 -> 输出：2026-01-05（周一）、2026-01-06（周二）补假。
      // 4. 输入：2026-01-02（周五）节假日 -> 输出：不产生补假。
      // 5. 输入：2026-01-04（周日）节假日，且 2026-01-05（周一）也是法定节假日 -> 输出：2026-01-06（周二）补假。
      function buildMalaysiaCompanyHolidays(items) {
        const seenLegalHolidays = new Set();
        const legalHolidays = [];

        items.filter(Boolean).forEach((item) => {
          const normalized = normalizeHoliday('MY', item);
          if (!normalized || normalized.type === 'substitute' || MALAYSIA_REPLACEMENT_NAME_PATTERN.test(normalized.name)) return;

          const dedupeKey = `${normalized.date}|${normalized.name}`;
          if (seenLegalHolidays.has(dedupeKey)) return;
          seenLegalHolidays.add(dedupeKey);
          legalHolidays.push({ ...normalized, region: 'MY', type: 'holiday' });
        });

        legalHolidays.sort((a, b) => a.date.localeCompare(b.date) || a.name.localeCompare(b.name));

        const occupiedHolidayDates = new Set(legalHolidays.map((item) => item.date));
        const occupiedSubstituteDates = new Set();
        const substitutes = [];

        legalHolidays.forEach((holiday) => {
          const holidayDate = parseYmd(holiday.date);
          if (holidayDate.getDay() !== 0 && holidayDate.getDay() !== 6) return;

          const candidate = new Date(holidayDate.getFullYear(), holidayDate.getMonth(), holidayDate.getDate() + 1);
          while (
            candidate.getDay() === 0 ||
            candidate.getDay() === 6 ||
            occupiedHolidayDates.has(ymd(candidate)) ||
            occupiedSubstituteDates.has(ymd(candidate))
          ) {
            candidate.setDate(candidate.getDate() + 1);
          }

          const substitute = normalizeHoliday('MY', {
            date: ymd(candidate),
            name: `${holiday.name}补假`,
            type: 'substitute',
          });
          substitutes.push(substitute);
          occupiedSubstituteDates.add(substitute.date);
        });

        return dedupeHolidays([...legalHolidays, ...substitutes]);
      }

      function verifyMalaysiaCompanyHolidayRules() {
        const substituteDates = (items) =>
          buildMalaysiaCompanyHolidays(items)
            .filter((item) => item.type === 'substitute')
            .map((item) => item.date);
        const cases = [
          {
            actual: substituteDates([{ date: '2026-01-03', name: 'A', region: 'MY', type: 'holiday' }]),
            expected: ['2026-01-05'],
          },
          {
            actual: substituteDates([{ date: '2026-01-04', name: 'A', region: 'MY', type: 'holiday' }]),
            expected: ['2026-01-05'],
          },
          {
            actual: substituteDates([
              { date: '2026-01-03', name: 'A', region: 'MY', type: 'holiday' },
              { date: '2026-01-04', name: 'B', region: 'MY', type: 'holiday' },
            ]),
            expected: ['2026-01-05', '2026-01-06'],
          },
          {
            actual: substituteDates([{ date: '2026-01-02', name: 'A', region: 'MY', type: 'holiday' }]),
            expected: [],
          },
          {
            actual: substituteDates([
              { date: '2026-01-04', name: 'A', region: 'MY', type: 'holiday' },
              { date: '2026-01-05', name: 'B', region: 'MY', type: 'holiday' },
            ]),
            expected: ['2026-01-06'],
          },
        ];
        return cases.every((item) => JSON.stringify(item.actual) === JSON.stringify(item.expected));
      }

      console.assert(verifyMalaysiaCompanyHolidayRules(), '居林工厂补假规则验算失败');

      function holidaySignature(items) {
        return JSON.stringify(dedupeHolidays(items));
      }

      function setHolidayDataset(region, year, data) {
        const key = holidayCacheKey(region, year);
        const normalized = region === 'MY' ? buildMalaysiaCompanyHolidays(data) : dedupeHolidays(data);
        if (holidaySignature(holidayDataSets[key] || []) === holidaySignature(normalized)) return false;
        holidayDataSets[key] = normalized;
        return true;
      }

      function readHolidayCache(region, year) {
        try {
          const cached = JSON.parse(localStorage.getItem(holidayCacheKey(region, year)) || 'null');
          if (!cached || !Number.isFinite(cached.fetchedAt) || !Array.isArray(cached.data)) return null;
          if (Date.now() - cached.fetchedAt > HOLIDAY_CACHE_TTL) return null;
          return {
            fetchedAt: cached.fetchedAt,
            data: dedupeHolidays(cached.data.map((item) => normalizeHoliday(region, item))),
          };
        } catch (error) {
          return null;
        }
      }

      function writeHolidayCache(region, year, data, fetchedAt) {
        try {
          localStorage.setItem(holidayCacheKey(region, year), JSON.stringify({ fetchedAt, data: dedupeHolidays(data) }));
        } catch (error) {
          // localStorage 不可用时仅影响缓存，不影响日历渲染。
        }
      }

      function getFallbackHolidays(region, year) {
        return FALLBACK_HOLIDAYS.filter((item) => item.region === region && Number(item.date.slice(0, 4)) === year);
      }

      function getHolidayTargetsForView() {
        const year = viewDate.getFullYear();
        const targets = [
          { region: 'CN', year },
          { region: 'MY', year },
        ];
        if (viewDate.getMonth() === 11) targets.push({ region: 'CN', year: year + 1 });
        return targets;
      }

      function hydrateHolidayDataForView() {
        let changed = false;
        getHolidayTargetsForView().forEach(({ region, year }) => {
          const cached = readHolidayCache(region, year);
          const immediateData = cached ? cached.data : getFallbackHolidays(region, year);
          changed = setHolidayDataset(region, year, immediateData) || changed;
        });
        return changed;
      }

      async function fetchHolidayJson(url, forceRefresh) {
        const response = await fetch(url, { cache: forceRefresh ? 'reload' : 'no-cache' });
        if (!response.ok) throw new Error(`Holiday request failed: ${response.status}`);
        return response.json();
      }

      async function fetchChinaHolidays(year, forceRefresh = false) {
        const raw = await fetchHolidayJson(`https://cdn.jsdelivr.net/gh/NateScarlet/holiday-cn@master/${year}.json`, forceRefresh);
        if (!Array.isArray(raw.days)) throw new Error('Invalid China holiday response');
        return dedupeHolidays(raw.days.map((item) => normalizeHoliday('CN', item)));
      }

      async function fetchMalaysiaHolidays(year, forceRefresh = false) {
        const raw = await fetchHolidayJson(
          `https://malaysia-holiday.dydxsoft.my/api/v1/holidays?year=${year}&state_code=KDH`,
          forceRefresh,
        );
        if (!Array.isArray(raw.data)) throw new Error('Invalid Malaysia holiday response');
        const kedahHolidays = raw.data.filter((item) => {
          const scope = String(item.scope || '').toLowerCase();
          const stateCodes = Array.isArray(item.state_codes)
            ? item.state_codes
            : String(item.state_codes || '')
                .split(/[\s,]+/)
                .filter(Boolean);
          return scope === 'national' || scope === 'federal' || stateCodes.includes('KDH');
        });
        return buildMalaysiaCompanyHolidays(kedahHolidays.map((item) => normalizeHoliday('MY', item)));
      }

      async function fetchRegionHolidays(region, year, forceRefresh = false) {
        return region === 'CN' ? fetchChinaHolidays(year, forceRefresh) : fetchMalaysiaHolidays(year, forceRefresh);
      }

      function setHolidayDataStatus(state, updatedAt = null) {
        holidayDataStatus.dataset.state = state;
        holidayDataStatus.dataset.time = updatedAt
          ? `${pad(updatedAt.getMonth() + 1)}-${pad(updatedAt.getDate())} ${pad(updatedAt.getHours())}:${pad(updatedAt.getMinutes())}`
          : '';
      }

      async function syncHolidayDataForView(forceRefresh = false) {
        const requestId = ++holidayRequestId;
        const targets = getHolidayTargetsForView();

        if (!forceRefresh && hydrateHolidayDataForView()) render();

        if (window.location.protocol === 'file:') {
          let fallbackChanged = false;
          targets.forEach(({ region, year }) => {
            fallbackChanged = setHolidayDataset(region, year, getFallbackHolidays(region, year)) || fallbackChanged;
          });
          setHolidayDataStatus('offline');
          if (fallbackChanged) render();
          return;
        }

        setHolidayDataStatus('loading');
        const results = await Promise.allSettled(
          targets.map(async ({ region, year }) => ({
            region,
            year,
            data: await fetchRegionHolidays(region, year, forceRefresh),
          })),
        );

        if (requestId !== holidayRequestId) return;

        let changed = false;
        let hasFailure = false;
        const fetchedAt = Date.now();

        results.forEach((result, index) => {
          const target = targets[index];
          if (result.status === 'fulfilled') {
            const { region, year, data } = result.value;
            writeHolidayCache(region, year, data, fetchedAt);
            changed = setHolidayDataset(region, year, data) || changed;
          } else {
            hasFailure = true;
            changed = setHolidayDataset(target.region, target.year, getFallbackHolidays(target.region, target.year)) || changed;
          }
        });

        setHolidayDataStatus(hasFailure ? 'offline' : 'updated', hasFailure ? null : new Date(fetchedAt));
        if (changed) render();
      }

      function getAllHolidayData() {
        return dedupeHolidays(Object.values(holidayDataSets).flat());
      }

      function getHolidayEntriesForDate(date) {
        const dateKey = ymd(date);
        return getAllHolidayData().filter((item) => item.date === dateKey);
      }

      function getHolidayEntriesForMonth(year, month) {
        const monthKey = `${year}-${pad(month + 1)}-`;
        return getAllHolidayData().filter((item) => item.date.startsWith(monthKey));
      }

      function sameDay(a, b) {
        return a.getFullYear() === b.getFullYear() && a.getMonth() === b.getMonth() && a.getDate() === b.getDate();
      }

      function getLunarDateText(date) {
        const parts = lunarFormatter.formatToParts(date);
        let month = '';
        let day = 1;

        parts.forEach((part) => {
          if (part.type === 'month') month = part.value.replace('月', '');
          if (part.type === 'day') day = Number(part.value.replace(/\D/g, ''));
        });

        if (!month) {
          month = lunarMonthNumFormatter.format(date);
          day = Number(lunarDayNumFormatter.format(date));
        }

        const monthNum = CN_MONTH_MAP[month] || parseInt(month, 10) || Number(month.replace(/\D/g, ''));

        return {
          month: monthNum,
          day,
          monthText: month.includes('月') ? month : `${month}月`,
          dayText: toLunarDay(day),
        };
      }

      function toLunarDay(day) {
        if (day <= 10) {
          const ones = ['十', '一', '二', '三', '四', '五', '六', '七', '八', '九', '十'];
          return day === 10 ? '初十' : `初${ones[day]}`;
        }
        if (day === 20) return '二十';
        if (day < 20) return `十${['', '一', '二', '三', '四', '五', '六', '七', '八', '九'][day - 10]}`;
        if (day < 30) return `廿${['一', '二', '三', '四', '五', '六', '七', '八', '九'][day - 21]}`;
        return '三十';
      }

      function qingMingDay(year) {
        return Math.floor(5.59 + 0.2422 * (year - 1900)) - Math.floor((year - 1900) / 4);
      }

      function getPublicHolidayStatus(date) {
        const item = getHolidayEntriesForDate(date).find((holiday) => holiday.region === 'CN');
        if (!item) return null;
        return { type: item.type === 'workday' ? 'work' : 'off', name: getHolidayDisplayName(item.name), region: item.region };
      }

      function getFestivalNames(date) {
        const names = [];
        const lunar = getLunarDateText(date);
        const month = date.getMonth() + 1;
        const day = date.getDate();

        COMMON_SOLAR_FESTIVALS.forEach((holiday) => {
          if (holiday.month === month && holiday.day === day) names.push(holiday.name);
        });

        if (month === 4 && day === qingMingDay(date.getFullYear())) names.push('清明节');

        COMMON_LUNAR_FESTIVALS.forEach((holiday) => {
          if (holiday.month === lunar.month && holiday.day === lunar.day) names.push(holiday.name);
        });

        return names;
      }

      function getHolidayItems(date) {
        return getHolidayEntriesForDate(date).map((item) => {
          const displayName = getHolidayDisplayName(item.name);
          return {
            ...item,
            text: item.type === 'workday' ? `班 ${displayName}` : displayName,
            kind: item.type === 'workday' ? 'work' : item.type === 'substitute' ? 'my-substitute' : item.region === 'MY' ? 'my' : 'rest',
          };
        });
      }

      function getHolidayDisplayName(name) {
        const hasSubstituteSuffix = String(name || '').includes('补假');
        const resolved = resolveHoliday(name);
        return `${resolved.zh}${resolved.id && hasSubstituteSuffix ? '补假' : ''}`;
      }

      function holidayItemDateText(item) {
        const start = item.startDate || item.date;
        const end = item.endDate || item.date;
        return start === end ? start : `${start} ~ ${end}`;
      }

      function openHolidayInfoDialog(item) {
        const isSubstitute = item.type === 'substitute' || String(item.name || '').includes('补假');
        const sourceName = String(item.name || '').replace(/补假/g, '').trim();
        const resolved = resolveHoliday(sourceName);
        holidayInfoTitle.textContent = resolved.zh;
        holidayInfoSubtitle.hidden = !isSubstitute;
        holidayInfoMeta.textContent = `${holidayItemDateText(item)} · ${item.region === 'CN' ? '中国' : '马来西亚'}`;
        holidayInfoBody.textContent = resolved.desc || '暂无介绍';
        holidayInfoOriginal.hidden = Boolean(resolved.id);
        holidayInfoOriginal.textContent = resolved.id ? '' : `原始名称：${item.name}`;
        document.body.classList.add('modal-open');
        holidayInfoDialog.showModal();
      }

      function closeHolidayInfoDialog() {
        if (holidayInfoDialog.open) holidayInfoDialog.close();
      }

      function getHolidayNames(date) {
        return getHolidayItems(date).map((item) => item.text);
      }

      function getWeekOfYear(date) {
        const d = new Date(date);
        const dayNum = (d.getDay() + 6) % 7;
        d.setDate(d.getDate() + 4 - dayNum);
        const yearStart = new Date(d.getFullYear(), 0, 1);
        const yearDay = Math.floor((d - yearStart) / 86400000) + 1;
        return Math.ceil(yearDay / 7);
      }

      function getDaySerial(date) {
        return Math.floor((Date.UTC(date.getFullYear(), date.getMonth(), date.getDate()) - Date.UTC(1900, 0, 31)) / 86400000);
      }

      function getAlmanac(date) {
        const serial = getDaySerial(date);
        const rule = ALMANAC_RULES[((serial % 12) + 12) % 12];
        const zodiac = ZODIACS[((serial + 4) % 12 + 12) % 12];
        const clash = ZODIACS[((serial + 10) % 12 + 12) % 12];

        return {
          yi: rule.good,
          ji: rule.bad,
          dayOfficer: rule.star,
          cai: DIRECTIONS[((serial + date.getMonth()) % DIRECTIONS.length + DIRECTIONS.length) % DIRECTIONS.length],
          xi: DIRECTIONS[((serial + 2) % DIRECTIONS.length + DIRECTIONS.length) % DIRECTIONS.length],
          fu: DIRECTIONS[((serial + 5) % DIRECTIONS.length + DIRECTIONS.length) % DIRECTIONS.length],
          clash: `冲${clash} · 煞${DIRECTIONS[((serial + 3) % DIRECTIONS.length + DIRECTIONS.length) % DIRECTIONS.length]} · ${zodiac}日`,
        };
      }

      function renderAlmanacTags(target, items, kind) {
        target.innerHTML = '';
        items.forEach((item) => {
          const tag = document.createElement('span');
          tag.className = 'almanac-chip';
          tag.dataset.kind = kind;
          tag.textContent = item;
          target.appendChild(tag);
        });
      }

      function normalizePanelIndex(index) {
        return ((Number(index) % 3) + 3) % 3;
      }

      function updatePanelDots(index) {
        panelDots.forEach((dot, dotIndex) => {
          dot.dataset.active = String(dotIndex === index);
          dot.setAttribute('aria-current', dotIndex === index ? 'page' : 'false');
        });
      }

      function setPanelPage(page) {
        activePanelPage = normalizePanelIndex(page);
        panelTrack.dataset.page = String(activePanelPage);
        panelTrack.style.transform = '';
        updatePanelDots(activePanelPage);
      }

      function preparePanelLoopClone(source) {
        const clone = source.cloneNode(true);
        clone.classList.add('panel-loop-clone');
        clone.setAttribute('aria-hidden', 'true');
        clone.removeAttribute('id');
        clone.querySelectorAll('[id]').forEach((element) => element.removeAttribute('id'));
        if ('inert' in clone) clone.inert = true;
        return clone;
      }

      function animatePanelLoop(direction) {
        if (panelLoopAnimating) return;
        const pages = [...panelTrack.children].filter((page) => page.classList.contains('panel-page'));
        const forward = direction > 0;
        const targetIndex = forward ? 0 : 2;
        const clone = preparePanelLoopClone(pages[targetIndex]);
        panelLoopAnimating = true;
        panelTrack.style.transition = 'none';

        if (forward) {
          panelTrack.appendChild(clone);
          panelTrack.style.transform = 'translateX(-66.6666%)';
        } else {
          panelTrack.insertBefore(clone, pages[0]);
          panelTrack.style.transform = 'translateX(-33.3333%)';
        }

        void panelTrack.offsetHeight;
        panelTrack.style.transition = 'transform 260ms ease';
        activePanelPage = targetIndex;
        updatePanelDots(activePanelPage);
        panelTrack.style.transform = forward ? 'translateX(-100%)' : 'translateX(0)';

        let completed = false;
        const finish = () => {
          if (completed) return;
          completed = true;
          panelTrack.removeEventListener('transitionend', handleTransitionEnd);
          panelTrack.style.transition = 'none';
          clone.remove();
          panelTrack.dataset.page = String(activePanelPage);
          panelTrack.style.transform = '';
          void panelTrack.offsetHeight;
          panelTrack.style.transition = '';
          panelLoopAnimating = false;
        };
        const handleTransitionEnd = (event) => {
          if (event.target === panelTrack) finish();
        };
        panelTrack.addEventListener('transitionend', handleTransitionEnd);
        setTimeout(finish, 340);
      }

      function handlePanelTouchStart(event) {
        event.stopPropagation();
        if (isModalGestureBlocked()) return;
        if (panelLoopAnimating) return;
        const touch = event.touches[0];
        if (!touch) return;
        panelTouchStartX = touch.clientX;
        panelTouchStartY = touch.clientY;
        panelTouchDeltaX = 0;
        panelTouchDeltaY = 0;
        panelTouchActive = true;
        panelTouchDirection = 'pending';
        panelTrack.style.transition = 'none';
      }

      function handlePanelTouchMove(event) {
        event.stopPropagation();
        if (isModalGestureBlocked()) return;
        if (!panelTouchActive) return;
        const touch = event.touches[0];
        if (!touch) return;
        panelTouchDeltaX = touch.clientX - panelTouchStartX;
        panelTouchDeltaY = touch.clientY - panelTouchStartY;

        const horizontalDistance = Math.abs(panelTouchDeltaX);
        const verticalDistance = Math.abs(panelTouchDeltaY);
        if (panelTouchDirection === 'pending') {
          if (Math.max(horizontalDistance, verticalDistance) < 6) return;
          panelTouchDirection = horizontalDistance > verticalDistance * 1.5 ? 'horizontal' : 'vertical';
        }
        if (panelTouchDirection === 'vertical') {
          panelTouchActive = false;
          panelTrack.style.transition = '';
          panelTrack.style.transform = '';
          return;
        }
        if (panelTouchDirection !== 'horizontal') return;

        event.preventDefault();
        const panelWidth = inspectorEl.clientWidth;
        const baseOffset = -activePanelPage * panelWidth;
        const dragOffset = panelTouchDeltaX;
        panelTrack.style.transform = `translateX(${baseOffset + dragOffset}px)`;
      }

      function handlePanelTouchEnd(event) {
        event.stopPropagation();
        if (isModalGestureBlocked()) return;
        if (!panelTouchActive) return;
        const touch = event.changedTouches[0];
        if (touch) {
          panelTouchDeltaX = touch.clientX - panelTouchStartX;
          panelTouchDeltaY = touch.clientY - panelTouchStartY;
        }

        const horizontalDistance = Math.abs(panelTouchDeltaX);
        const verticalDistance = Math.abs(panelTouchDeltaY);
        if (panelTouchDirection === 'pending') {
          panelTouchDirection = horizontalDistance > verticalDistance * 1.5 ? 'horizontal' : 'vertical';
        }
        if (panelTouchDirection !== 'horizontal') {
          panelTouchActive = false;
          panelTouchDirection = 'idle';
          panelTrack.style.transition = '';
          panelTrack.style.transform = '';
          return;
        }
        const isHorizontalSwipe = horizontalDistance > 60 && horizontalDistance > verticalDistance * 1.5;

        panelTouchActive = false;
        panelTouchDirection = 'idle';
        panelTrack.style.transition = '';
        panelTrack.style.transform = '';
        if (!isHorizontalSwipe) {
          setPanelPage(activePanelPage);
          return;
        }

        const forward = panelTouchDeltaX < 0;
        if ((activePanelPage === 2 && forward) || (activePanelPage === 0 && !forward)) {
          animatePanelLoop(forward ? 1 : -1);
          return;
        }

        const nextPage = forward
          ? (activePanelPage + 1) % 3
          : (activePanelPage + 2) % 3;
        setPanelPage(nextPage);
      }

      function makeBadge(text, variant = '') {
        const badge = document.createElement('span');
        const className = variant === true ? 'gold' : variant;
        badge.className = className ? `badge ${className}` : 'badge';
        badge.textContent = text;
        badge.title = text;
        return badge;
      }

      function updateTodayButtonState(year, month) {
        const isCurrentMonth = year === today.getFullYear() && month === today.getMonth();
        const visibility = isCurrentMonth ? 'hidden' : 'visible';
        todayBtn.style.visibility = visibility;
        todayDivider.style.visibility = visibility;
        todayBtn.setAttribute('aria-hidden', String(isCurrentMonth));
      }

      function createTripPlaneIcon() {
        const namespace = 'http://www.w3.org/2000/svg';
        const svg = document.createElementNS(namespace, 'svg');
        svg.classList.add('trip-plane');
        svg.setAttribute('viewBox', '0 0 24 24');
        svg.setAttribute('width', '12');
        svg.setAttribute('height', '12');
        svg.setAttribute('fill', 'currentColor');
        svg.setAttribute('aria-hidden', 'true');
        svg.setAttribute('focusable', 'false');

        const path = document.createElementNS(namespace, 'path');
        path.setAttribute('d', 'M12 2 15 10 22 13 22 15 14 14 12 22 10 22 10 14 2 15 2 13 9 10Z');
        path.setAttribute('transform', 'rotate(45 12 12)');
        svg.appendChild(path);
        return svg;
      }

      function isModalGestureBlocked() {
        return Boolean(tripDialog.open || anniversaryDialog.open || datePickerDialog.open);
      }

      function calendarMonthSerial(date) {
        return date.getFullYear() * 12 + date.getMonth();
      }

      function resetCalendarGridTransform() {
        calendarSurfaceEl.style.transition = '';
        calendarSurfaceEl.style.transform = '';
      }

      function changeCalendarMonth(targetMonth, { selected = null, initialOffset = null } = {}) {
        if (calendarMonthAnimating || isModalGestureBlocked()) return;
        const normalizedTarget = new Date(targetMonth.getFullYear(), targetMonth.getMonth(), 1);
        const difference = calendarMonthSerial(normalizedTarget) - calendarMonthSerial(viewDate);
        if (difference === 0) {
          if (selected) {
            selectedDate = new Date(selected.getFullYear(), selected.getMonth(), selected.getDate());
            render();
          }
          resetCalendarGridTransform();
          return;
        }

        calendarMonthAnimating = true;
        closePicker();
        const direction = difference > 0 ? 1 : -1;
        if (initialOffset !== null) calendarSurfaceEl.style.transform = `translateX(${initialOffset}px)`;
        calendarSurfaceEl.style.transition = 'transform 140ms ease-out';
        requestAnimationFrame(() => {
          calendarSurfaceEl.style.transform = `translateX(${direction > 0 ? '-100%' : '100%'})`;
        });

        setTimeout(() => {
          viewDate = normalizedTarget;
          if (selected) selectedDate = new Date(selected.getFullYear(), selected.getMonth(), selected.getDate());
          render();
          syncHolidayDataForView();

          calendarSurfaceEl.style.transition = 'none';
          calendarSurfaceEl.style.transform = `translateX(${direction > 0 ? '100%' : '-100%'})`;
          void calendarSurfaceEl.offsetHeight;
          calendarSurfaceEl.style.transition = 'transform 240ms ease-out';
          calendarSurfaceEl.style.transform = 'translateX(0)';

          setTimeout(() => {
            resetCalendarGridTransform();
            calendarMonthAnimating = false;
          }, 240);
        }, 140);
      }

      function handleCalendarTouchStart(event) {
        event.stopPropagation();
        calendarTouchActive = false;
        if (isModalGestureBlocked() || calendarMonthAnimating || event.touches.length !== 1) return;
        const touch = event.touches[0];
        calendarTouchActive = true;
        calendarTouchStartX = touch.clientX;
        calendarTouchStartY = touch.clientY;
        calendarTouchDeltaX = 0;
        calendarTouchDeltaY = 0;
        calendarTouchDirection = 'pending';
        calendarSurfaceEl.style.transition = 'none';
      }

      function handleCalendarTouchMove(event) {
        event.stopPropagation();
        if (!calendarTouchActive || isModalGestureBlocked() || event.touches.length !== 1) return;
        const touch = event.touches[0];
        calendarTouchDeltaX = touch.clientX - calendarTouchStartX;
        calendarTouchDeltaY = touch.clientY - calendarTouchStartY;
        const horizontal = Math.abs(calendarTouchDeltaX);
        const vertical = Math.abs(calendarTouchDeltaY);
        if (calendarTouchDirection === 'pending') {
          if (Math.max(horizontal, vertical) < 6) return;
          calendarTouchDirection = horizontal > vertical * 1.5 ? 'horizontal' : 'vertical';
        }
        if (calendarTouchDirection === 'vertical') {
          calendarSurfaceEl.style.transform = 'translateX(0)';
          return;
        }
        if (calendarTouchDirection !== 'horizontal') return;
        event.preventDefault();
        const limit = calendarSurfaceEl.getBoundingClientRect().width * 0.15;
        const dampedOffset = Math.max(-limit, Math.min(limit, calendarTouchDeltaX * 0.4));
        calendarSurfaceEl.style.transform = `translateX(${dampedOffset}px)`;
      }

      function handleCalendarTouchEnd(event) {
        event.stopPropagation();
        if (!calendarTouchActive) return;
        calendarTouchActive = false;
        const horizontal = Math.abs(calendarTouchDeltaX);
        const vertical = Math.abs(calendarTouchDeltaY);
        if (horizontal > 10) {
          suppressCalendarClick = true;
          setTimeout(() => {
            suppressCalendarClick = false;
          }, 500);
        }

        const shouldChangeMonth = calendarTouchDirection === 'horizontal' && horizontal > 60 && horizontal > vertical * 1.5;
        const limit = calendarSurfaceEl.getBoundingClientRect().width * 0.15;
        const dampedOffset = Math.max(-limit, Math.min(limit, calendarTouchDeltaX * 0.4));
        if (shouldChangeMonth && !isModalGestureBlocked()) {
          const monthDelta = calendarTouchDeltaX < 0 ? 1 : -1;
          changeCalendarMonth(
            new Date(viewDate.getFullYear(), viewDate.getMonth() + monthDelta, 1),
            { initialOffset: dampedOffset },
          );
        } else {
          calendarSurfaceEl.style.transition = 'transform 200ms ease';
          calendarSurfaceEl.style.transform = 'translateX(0)';
          setTimeout(resetCalendarGridTransform, 200);
        }
        calendarTouchDirection = 'idle';
      }

      function handleCalendarTouchCancel(event) {
        event.stopPropagation();
        calendarTouchActive = false;
        calendarTouchDirection = 'idle';
        calendarSurfaceEl.style.transition = 'transform 200ms ease';
        calendarSurfaceEl.style.transform = 'translateX(0)';
        setTimeout(resetCalendarGridTransform, 200);
      }

      function render() {
        const year = viewDate.getFullYear();
        const month = viewDate.getMonth();
        const currentLunar = getLunarDateText(new Date(year, month, 1));

        monthLabel.textContent = `${year} 年 ${pad(month + 1)} 月`;
        monthLunarHint.textContent = `农历${currentLunar.monthText}`;
        updateTodayButtonState(year, month);
        if (!pickerPopover.hidden) renderPicker();

        weeksEl.innerHTML = '';
        const firstDay = new Date(year, month, 1);
        const startWeekday = (firstDay.getDay() + 6) % 7;
        const daysInMonth = new Date(year, month + 1, 0).getDate();
        const daysInPrevMonth = new Date(year, month, 0).getDate();
        const cells = [];

        for (let i = 0; i < startWeekday; i += 1) {
          const day = daysInPrevMonth - (startWeekday - i - 1);
          cells.push({ date: new Date(year, month - 1, day), inMonth: false });
        }

        for (let day = 1; day <= daysInMonth; day += 1) {
          cells.push({ date: new Date(year, month, day), inMonth: true });
        }

        while (cells.length < 42) {
          const day = cells.length - startWeekday - daysInMonth + 1;
          cells.push({ date: new Date(year, month + 1, day), inMonth: false });
        }

        const tripSegments = buildTripSegments();
        const todayKey = formatDateKey(today);

        for (let rowIndex = 0; rowIndex < 6; rowIndex += 1) {
          const row = document.createElement('div');
          row.className = 'week-row';

          const rowStart = rowIndex * 7;
          const weekIndex = document.createElement('div');
          weekIndex.className = 'week-col';
          weekIndex.textContent = `W${getWeekOfYear(cells[rowStart].date)}`;
          row.appendChild(weekIndex);

          for (let colIndex = 0; colIndex < 7; colIndex += 1) {
            const item = cells[rowStart + colIndex];
            const date = item.date;
            const lunar = getLunarDateText(date);
            const solarTerm = getSolarTerm(date);
            const holidayStatus = getPublicHolidayStatus(date);
            const holidayItems = getHolidayItems(date);
            const isToday = sameDay(date, today);
            const isSelected = sameDay(date, selectedDate);
            const dateKey = formatDateKey(date);
            const activeTripSegments = tripSegments.filter((segment) => segment.start <= dateKey && segment.end >= dateKey);

            const cell = document.createElement('button');
            cell.className = 'day-cell';
            cell.type = 'button';
            cell.setAttribute('aria-label', `${date.getFullYear()}年${date.getMonth() + 1}月${date.getDate()}日`);

            if (!item.inMonth) cell.classList.add('out-month');
            if (date.getDay() === 0 || date.getDay() === 6) cell.classList.add('weekend');
            if (isToday) cell.classList.add('today');
            if (isSelected) cell.classList.add('selected');
            if (holidayStatus?.type === 'off') cell.classList.add('holiday-off');
            if (holidayStatus?.type === 'work') cell.classList.add('adjusted-work');

            const top = document.createElement('div');
            top.className = 'day-top';

            const number = document.createElement('div');
            number.className = 'day-number';
            number.textContent = date.getDate();
            if (isToday || isSelected) {
              number.classList.add('date-badge');
              number.dataset.state = isToday ? 'today' : 'selected';
            }

            top.appendChild(number);

            const lunarText = document.createElement('div');
            lunarText.className = 'lunar';
            lunarText.textContent = solarTerm || `${lunar.monthText}${lunar.dayText}`;
            if (solarTerm) lunarText.dataset.solarTerm = 'true';

            const dayBadges = document.createElement('div');
            dayBadges.className = 'day-badges';
            dayBadges.setAttribute('aria-hidden', 'true');

            const cellSlots = document.createElement('div');
            cellSlots.className = 'cell-slots';

            const tripSlot = document.createElement('div');
            tripSlot.className = 'trip-slot';
            tripSlot.setAttribute('aria-hidden', 'true');

            if (activeTripSegments.length) {
              const segment = activeTripSegments[0];
              const tripBar = document.createElement('span');
              tripBar.className = 'trip-bar';
              tripBar.dataset.roundLeft = String(segment.roundLeft && dateKey === segment.start);
              tripBar.dataset.roundRight = String(segment.roundRight && dateKey === segment.end);
              tripBar.dataset.segmentStart = String(dateKey === segment.start);
              tripBar.dataset.segmentEnd = String(dateKey === segment.end);
              tripBar.dataset.firstSegment = String(segment.roundLeft && dateKey === segment.start);
              tripBar.dataset.past = String(segment.trip.end < todayKey);
              tripBar.title = `${segment.trip.code} ${segment.trip.start} ~ ${segment.trip.end}`;
              if (dateKey === segment.start) {
                const label = document.createElement('span');
                label.className = 'trip-label';
                const code = document.createElement('span');
                code.className = 'trip-code';
                code.textContent = segment.trip.code;
                label.append(createTripPlaneIcon(), code);
                tripBar.appendChild(label);
              }
              tripSlot.appendChild(tripBar);
            }

            [
              { region: 'CN', type: 'holiday', badgeType: 'cn', title: '中国大陆节假日' },
              { region: 'MY', type: 'holiday', badgeType: 'my', title: '马来西亚节假日' },
              { region: 'MY', type: 'substitute', badgeType: 'my-sub', title: '马来西亚补假' },
              { region: 'CN', type: 'workday', badgeType: 'workday', title: '中国大陆调休补班日' },
            ].forEach(({ region, type, badgeType, title }) => {
              const matchingHolidays = holidayItems.filter((holiday) => holiday.region === region && holiday.type === type);
              if (!matchingHolidays.length) return;
              const badge = document.createElement('span');
              badge.className = 'day-badge';
              badge.dataset.type = badgeType;
              badge.title = matchingHolidays.map((holiday) => getHolidayDisplayName(holiday.name)).join('、') || title;
              dayBadges.appendChild(badge);

            cellSlots.appendChild(tripSlot);

            if (activeTripSegments.length > 1) {
              const more = document.createElement('span');

              more.textContent = `+${activeTripSegments.length - 1}`;
              more.title = `另有 ${activeTripSegments.length - 1} 条出差`;
              cell.appendChild(more);

            renderAnniversaryIcons(cell, date);

            cell.addEventListener('click', () => {
              const viewChanged = date.getMonth() !== viewDate.getMonth() || date.getFullYear() !== viewDate.getFullYear();
              selectedDate = new Date(date.getFullYear(), date.getMonth(), date.getDate());
              if (viewChanged) {
                viewDate = new Date(date.getFullYear(), date.getMonth(), 1);
              }
              render();
              if (viewChanged) syncHolidayDataForView();

            row.appendChild(cell);
          }

          weeksEl.appendChild(row);

        renderSelectedDate();
        renderMonthHolidayList(year, month);
        renderMonthTripList(year, month);
        renderMonthAnniversaryList(year, month);

      /*
       * mergeConsecutiveHolidays() 列表显示验算：
       * 输入：05-01 至 05-05 五条“劳动节”，region=CN
       * 输出：05-01 ~ 05-05 劳动节
       * 输入：05-01 劳动节 region=CN；05-01 劳动节 region=MY
       * 输出：保持两条，不跨地区合并
       * 输入：05-27 哈芝节；05-28 哈芝节第二天
       * 输出：名称不同，保持两条
       * 输入：05-27 单日节假日
       * 输出：05-27，不显示 05-27 ~ 05-27
       */
      function mergeConsecutiveHolidays(list) {
        const groups = new Map();

        list.forEach((item) => {
          const key = `${item.region}\u0000${item.name}`;
          if (!groups.has(key)) groups.set(key, []);
          groups.get(key).push(item);
        });

        const merged = [];
        groups.forEach((group) => {
          const sorted = [...group].sort((a, b) => a.date.localeCompare(b.date));
          let current = null;

          sorted.forEach((item) => {
            const isConsecutive = current
              && formatDateKey(addDays(parseDateKey(current.endDate), 1)) === item.date;

            if (isConsecutive) {
              current.endDate = item.date;
              return;
            }

            if (current) merged.push(current);
            current = { ...item, startDate: item.date, endDate: item.date };
          });

          if (current) merged.push(current);
        });

        return merged.sort((a, b) => (
          a.startDate.localeCompare(b.startDate)
          || a.region.localeCompare(b.region)
          || a.name.localeCompare(b.name)
        ));
      }

      }

      function renderMonthTripList(year, month) {
        const monthStart = `${year}-${pad(month + 1)}-01`;
        const monthEnd = formatDateKey(new Date(year, month + 1, 0));
        const monthTrips = trips.filter((trip) => trip.start <= monthEnd && trip.end >= monthStart);
        tripListEl.innerHTML = '';
        tripEmpty.hidden = monthTrips.length > 0;
        monthTrips.forEach((trip) => tripListEl.appendChild(createTripItem(trip)));
      }

      function getMonthAnniversaryOccurrences(year, month) {
        const occurrences = [];
        const daysInMonth = new Date(year, month + 1, 0).getDate();
        for (let day = 1; day <= daysInMonth; day += 1) {
          const date = new Date(year, month, day);
          getAnniversariesForDate(date).forEach((record) => occurrences.push({ record, date }));
        }
        return occurrences.sort((a, b) => a.date - b.date || a.record.name.localeCompare(b.record.name));
      }

      function createAnniversaryItem(occurrence, displayYear) {
        const item = document.createElement('button');
        item.className = 'anniversary-item';
        item.type = 'button';
        item.dataset.past = String(isAnniversaryPast(occurrence.record, occurrence.date));
        const date = document.createElement('span');
        date.className = 'anniversary-item-date';
        date.textContent = `${pad(occurrence.date.getMonth() + 1)}-${pad(occurrence.date.getDate())}`;
        const name = document.createElement('span');
        name.className = 'anniversary-item-name';
        name.textContent = `${occurrence.record.name}${getAnniversarySuffix(occurrence.record, displayYear)}`;
        item.append(date, createAnniversaryIcon(occurrence.record.type), name);
        item.title = occurrence.record.note || occurrence.record.name;
        item.addEventListener('click', () => openAnniversaryDialog(occurrence.record));
        return item;
      }

      function renderMonthAnniversaryList(year, month) {
        const occurrences = getMonthAnniversaryOccurrences(year, month);
        anniversaryListEl.innerHTML = '';
        anniversaryEmpty.hidden = occurrences.length > 0;
        occurrences.forEach((occurrence) => anniversaryListEl.appendChild(createAnniversaryItem(occurrence, year)));
      }

      function findUpcomingAnniversaryDate(record) {
        const start = new Date(today.getFullYear(), today.getMonth(), today.getDate());
        for (let offset = 0; offset <= 30; offset += 1) {
          const candidate = new Date(start.getFullYear(), start.getMonth(), start.getDate() + offset);
          if (anniversaryMatchesDate(record, candidate)) return candidate;
        }
        return null;
      }

      function renderUpcomingAnniversaries() {
        const start = new Date(today.getFullYear(), today.getMonth(), today.getDate());
        const upcoming = anniversaries
          .map((record) => ({ record, date: findUpcomingAnniversaryDate(record) }))
          .filter((item) => item.date)
          .map((item) => ({ ...item, daysLeft: Math.round((item.date.getTime() - start.getTime()) / 86400000) }))
          .sort((a, b) => a.daysLeft - b.daysLeft || a.record.name.localeCompare(b.record.name))
          .slice(0, 5);

        upcomingAnniversaryList.innerHTML = '';
        upcomingAnniversarySection.hidden = upcoming.length === 0;
        upcoming.forEach((item) => {
          const button = document.createElement('button');
          button.className = 'upcoming-item';
          button.type = 'button';
          const name = document.createElement('span');
          name.className = 'upcoming-item-name';
          name.textContent = item.record.name;
          const date = document.createElement('span');
          date.className = 'upcoming-item-date';
          date.textContent = `${pad(item.date.getMonth() + 1)}-${pad(item.date.getDate())}`;
          const countdown = document.createElement('span');
          countdown.className = 'upcoming-item-countdown';
          countdown.textContent = item.daysLeft === 0 ? '今天' : item.daysLeft === 1 ? '明天' : `还有 ${item.daysLeft} 天`;
          button.append(createAnniversaryIcon(item.record.type), name, date, countdown);
          button.addEventListener('click', () => openAnniversaryDialog(item.record));
          upcomingAnniversaryList.appendChild(button);
        });
      }

      function scheduleMidnightRefresh() {
        const now = new Date();
        const nextMidnight = new Date(now.getFullYear(), now.getMonth(), now.getDate() + 1);
        const delay = nextMidnight.getTime() - now.getTime() + 1000;
        setTimeout(() => {
          today.setTime(Date.now());
          render();
          syncHolidayDataForView();
          refreshWeatherBriefing(true);
          scheduleMidnightRefresh();
        }, delay);
      }

      document.getElementById('prevBtn').addEventListener('click', () => {
        viewDate = new Date(viewDate.getFullYear(), viewDate.getMonth() - 1, 1);
        render();
        syncHolidayDataForView();
      });

      document.getElementById('nextBtn').addEventListener('click', () => {
        viewDate = new Date(viewDate.getFullYear(), viewDate.getMonth() + 1, 1);
        render();
        syncHolidayDataForView();
      });

      todayBtn.addEventListener('click', () => {
        changeCalendarMonth(
          new Date(today.getFullYear(), today.getMonth(), 1),
          { selected: new Date(today.getFullYear(), today.getMonth(), today.getDate()) },
        );
      });

      refreshHolidayBtn.addEventListener('click', () => syncHolidayDataForView(true));
      refreshBriefingBtn.addEventListener('click', () => refreshWeatherBriefing(true));

      document.getElementById('addTripBtn').addEventListener('click', () => openTripDialog());
      tripStartInput.addEventListener('click', () => {
        openDatePicker({
          value: tripStartInput.value || null,
          mode: 'solar',
          onSelect: (value) => {
            setTripDateButtonValue(tripStartInput, value);
            setTripError();
          },
        });
      });
      tripEndInput.addEventListener('click', () => {
        openDatePicker({
          value: tripEndInput.value || tripStartInput.value || null,
          mode: 'solar',
          onSelect: (value) => {
            setTripDateButtonValue(tripEndInput, value);
            setTripError();
          },
        });
      });
      tripForm.addEventListener('submit', saveTripFromDialog);
      deleteTripBtn.addEventListener('click', deleteEditingTrip);
      document.getElementById('cancelTripBtn').addEventListener('click', closeTripDialog);
      tripCodeInput.addEventListener('input', syncSiteChips);
      tripDialog.addEventListener('click', (event) => {
        if (event.target === tripDialog) closeTripDialog();
      });
      document.getElementById('addAnniversaryBtn').addEventListener('click', () => openAnniversaryDialog());
      backupDataBtn.addEventListener('click', backupAllData);
      restoreDataBtn.addEventListener('click', () => {
        backupDataStatus.textContent = '';
        if (!window.confirm('恢复备份将覆盖当前全部出差和重要日子数据，是否继续？')) return;
        restoreDataInput.value = '';
        restoreDataInput.click();
      });
      restoreDataInput.addEventListener('change', () => {
        const [file] = restoreDataInput.files;
        if (file) restoreAllDataFromFile(file);
      });
      anniversaryDateButton.addEventListener('click', () => {
        openDatePicker({
          value: anniversarySelectedDateValue,
          mode: getAnniversaryDatePickerMode(),
          onSelect: (value) => {
            anniversarySelectedDateValue = value;
            updateAnniversaryDateButton();
            setAnniversaryError();
          },
        });
      });
      anniversaryForm.addEventListener('submit', saveAnniversaryFromDialog);
      deleteAnniversaryBtn.addEventListener('click', deleteEditingAnniversary);
      document.getElementById('cancelAnniversaryBtn').addEventListener('click', closeAnniversaryDialog);
      anniversaryDialog.addEventListener('click', (event) => {
        if (event.target === anniversaryDialog) closeAnniversaryDialog();
      });
      bindDatePickerWheel(datePickerYearWheel, 'year');
      bindDatePickerWheel(datePickerMonthWheel, 'month');
      bindDatePickerWheel(datePickerDayWheel, 'day');
      datePickerCancelBtn.addEventListener('click', () => {
        datePickerOnSelect = null;
        datePickerDialog.close();
      });
      datePickerConfirmBtn.addEventListener('click', () => {
        const selectedDate = getPickerSelectedDate();
        if (!selectedDate) {
          datePickerError.textContent = '请选择有效日期。';
          return;
        }
        const onSelect = datePickerOnSelect;
        datePickerOnSelect = null;
        datePickerDialog.close();
        if (onSelect) onSelect(formatDateKey(selectedDate));
      });
      datePickerDialog.addEventListener('click', (event) => {
        if (event.target === datePickerDialog) {
          datePickerOnSelect = null;
          datePickerDialog.close();
        }
      });
      datePickerDialog.addEventListener('cancel', () => {
        datePickerOnSelect = null;
      });
      closeHolidayInfoBtn.addEventListener('click', closeHolidayInfoDialog);
      holidayInfoDialog.addEventListener('click', (event) => {
        if (event.target === holidayInfoDialog) closeHolidayInfoDialog();
      });
      holidayInfoDialog.addEventListener('close', () => {
        document.body.classList.remove('modal-open');
      });

      panelDots.forEach((dot) => {
        dot.addEventListener('click', () => {
          if (!panelLoopAnimating) setPanelPage(Number(dot.dataset.page));
        });
      });

      inspectorEl.addEventListener('touchstart', handlePanelTouchStart, { passive: true });
      inspectorEl.addEventListener('touchmove', handlePanelTouchMove, { passive: false });
      inspectorEl.addEventListener('touchend', handlePanelTouchEnd, { passive: true });
      inspectorEl.addEventListener('touchcancel', handlePanelTouchEnd, { passive: true });

      weeksEl.addEventListener('touchstart', handleCalendarTouchStart, { passive: true });
      weeksEl.addEventListener('touchmove', handleCalendarTouchMove, { passive: false });
      weeksEl.addEventListener('touchend', handleCalendarTouchEnd, { passive: true });
      weeksEl.addEventListener('touchcancel', handleCalendarTouchCancel, { passive: true });
      weeksEl.addEventListener('click', (event) => {
        if (!suppressCalendarClick) return;
        event.preventDefault();
        event.stopImmediatePropagation();
        suppressCalendarClick = false;
      }, true);

      calendarPrevButton?.addEventListener('click', (event) => {
        event.preventDefault();
        event.stopImmediatePropagation();
        changeCalendarMonth(new Date(viewDate.getFullYear(), viewDate.getMonth() - 1, 1));
      }, true);
      calendarNextButton?.addEventListener('click', (event) => {
        event.preventDefault();
        event.stopImmediatePropagation();
        changeCalendarMonth(new Date(viewDate.getFullYear(), viewDate.getMonth() + 1, 1));
      }, true);

      monthTitleBtn.addEventListener('click', togglePicker);

      document.getElementById('pickerPrevYear').addEventListener('click', () => {
        pickerYearValue -= 1;
        renderPicker();
      });

      document.getElementById('pickerNextYear').addEventListener('click', () => {
        pickerYearValue += 1;
        renderPicker();
      });

      document.addEventListener('click', (event) => {
        if (!pickerPopover.hidden && !event.target.closest('.month-picker-wrap')) {
          closePicker();
        }
      });

      document.addEventListener('keydown', (event) => {
        if (event.key === 'Escape' && !pickerPopover.hidden) closePicker();
      });

      setPanelPage(0);
      renderSiteChips();
      hydrateHolidayDataForView();
      render();
      syncHolidayDataForView();
      hydrateBriefingData();
      scheduleMidnightRefresh();
    </script>
  </body>
</html>
